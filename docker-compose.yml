services:
  app:
    build: .
    container_name: app_riwimedicare

    working_dir: /usr/src/app

    ports:
      - "${PORT}:${PORT}"

    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

    env_file:
      - ./.env

    environment:
      NODE_ENV: development

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

  db:
    image: postgres:15-alpine
    container_name: db_riwimedicare
    restart: always

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge

